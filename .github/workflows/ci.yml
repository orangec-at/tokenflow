name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Not a measurement step. The benchmark asserts that the batched output is
      # byte-identical to the unbatched one, so a batching change that alters
      # what the reader sees fails here rather than in someone's app.
      - run: pnpm bench

      - run: pnpm build
